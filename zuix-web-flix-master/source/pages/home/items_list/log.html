
<div class="login-container">
   <div class="profilex pulse" layout="row center">
  </div>

   <h2>Login</h2>
   <form class="loginForm" id="loginForm"
     <label for="username">Username:</label>
     <input type="text" id="username" class="username" name="username" required>
     <br>
     <label for="password">Password:</label>
     <input type="password" id="password" class="password" name="password" required>
     <br>
     <button type="submit" class="btn">Login</button>
     <div class="social-login">
       <button class="btn google"><i class="fab fa-google"></i>Google</button>
       <button class="btn facebook"><i class="fab fa-facebook-f"></i>Facebook</button>
     </div>
   </form>
 </div>
