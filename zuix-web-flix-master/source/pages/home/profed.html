<header>
 <button>
  <i class="material-icons">arrow_back</i>
 </button>
 <h1 data-ui-field="title">Edit Profile</h1>
</header>

<main>
 <div class="profile-pic-container">
  <div data-ui-field="cover" class="profile-pic">
   <img id="profile-pic-img" src="your-image.jpg" alt="Profile Image">
  </div>
  <button class="edit-button" onclick="document.getElementById('profile-pic-input').click();">
   <i class="material-icons">edit</i>
  </button>
  <input type="file" id="profile-pic-input" style="display: none;">
 </div>
 <form id="profileForm">
  <div class="form-group" data-ui-field="editableName">
   <label for="name">Name</label>
   <input type="text" id="name" name="name" value="Benny" data-ui-field="nameInput" required>
  </div>
  <div class="form-group">
   <label for="bio">Bio</label>
   <textarea id="bio" name="bio" rows="4" required>Hi, I'm John! I love hiking, photography, and trying out new restaurants. Looking to meet new people and make lasting connections.</textarea>
  </div>
  <div class="form-group">
   <label for="interests">Interests</label>
   <input type="text" id="interests" name="interests" value="Travel, Music, Cooking, Reading, Fitness" required>
  </div>
  <div class="form-group">
   <label for="education">Education</label>
   <input type="text" id="education" name="education" value="Bachelor's in Computer Science, ABC University" required>
  </div>
  <div class="form-group">
   <label for="work">Work</label>
   <input type="text" id="work" name="work" value="Web Developer at XYZ Company" required>
  </div>
  <button type="submit">Save</button>
 </form>
</main>

<footer layout="row center-spread">
 <div data-ui-field="edit-btn">
  <i class="material-icons">edit</i>
 </div>
 <div>
  <i class="material-icons">thumb_up</i>
 </div>
 <div data-ui-field="save-btn">
  <i class="material-icons">save</i>
 </div>
</footer>
