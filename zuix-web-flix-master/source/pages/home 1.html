<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }
        header button {
            background: none;
            border: none;
            cursor: pointer;
        }
        header h1 {
            flex-grow: 1;
            text-align: center;
            margin: 0;
        }
        main {
            padding: 20px;
        }
        .profile-pic-container {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 20px;
        }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #ddd;
        }
        .profile-pic img {
            width: 100%;
            height: auto;
        }
        .edit-button {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            color: #fff;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            padding: 5px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
        .form-group button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        footer {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background-color: #f5f5f5;
            border-top: 1px solid #ddd;
        }
        footer div {
            cursor: pointer;
        }
    </style>
</head>
<body>
<header>
    <button>
        <i class="material-icons">arrow_back</i>
    </button>
    <h1 data-ui-field="title">Edit Profile</h1>
</header>

<main>
    <div class="profile-pic-container">
        <div data-ui-field="cover" class="profile-pic">
            <img id="profile-pic-img" src="your-image.jpg" alt="Profile Image">
        </div>
        <button class="edit-button" onclick="document.getElementById('profile-pic-input').click();">
            <i class="material-icons">edit</i>
        </button>
        <input type="file" id="profile-pic-input" style="display: none;">
    </div>
    <form id="profileForm">
        <div class="form-group" data-ui-field="editableName">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" value="Benny" data-ui-field="nameInput" required>
        </div>
        <div class="form-group">
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" rows="4" required>Hi, I'm John! I love hiking, photography, and trying out new restaurants. Looking to meet new people and make lasting connections.</textarea>
        </div>
        <div class="form-group">
            <label for="interests">Interests</label>
            <input type="text" id="interests" name="interests" value="Travel, Music, Cooking, Reading, Fitness" required>
        </div>
        <div class="form-group">
            <label for="education">Education</label>
            <input type="text" id="education" name="education" value="Bachelor's in Computer Science, ABC University" required>
        </div>
        <div class="form-group">
            <label for="work">Work</label>
            <input type="text" id="work" name="work" value="Web Developer at XYZ Company" required>
        </div>
        <button type="submit">Save</button>
    </form>
</main>

<footer layout="row center-spread">
    <div data-ui-field="edit-btn">
        <i class="material-icons">edit</i>
    </div>
    <div>
        <i class="material-icons">thumb_up</i>
    </div>
    <div data-ui-field="save-btn">
        <i class="material-icons">save</i>
    </div>
</footer>
</body>
</html>
